name: pysbom_dev
channels:
  - defaults
  - conda-forge
dependencies:
  # Run
  - click >=8.0
  - cyclonedx-bom >=7.0
  - pydantic >=2.0
  - pydantic-settings >=2.10
  - python >=3.11

  # Test
  - pytest >=7.0

  # Build
  - python-build >=1.0
  - setuptools >=77.0
  - twine >=6.2

  # Tools
  - ruff >=0.12
  - mypy >=1.0
