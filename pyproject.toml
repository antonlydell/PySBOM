[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PySBOM"
authors = [
  { name="Anton Lydell", email="anton.lydell@tuta.com" },
]
description = "CLI tool to automatically discover Python environments and generate CycloneDX SBOMs at scale."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

keywords = [
    "sbom",
    "cyclonedx",
    "python",
    "conda",
    "venv",
    "supply-chain",
    "security",
    "dependency-management",
    "devsecops",
    "cli",
]

dynamic = ["version"]

dependencies = [
    "click >= 8.0",
    "cyclonedx-bom >= 7.0",
    "pydantic >= 2.0",
    "pydantic-settings >= 2.10",
]

[project.scripts]
pysbom = "pysbom.cli.main:main"

[project.urls]
"Bug Tracker" = "https://github.com/antonlydell/PySBOM/issues"
"Documentation" = "https://github.com/antonlydell/PySBOM"
"Source Code" = "https://github.com/antonlydell/PySBOM"

[tool.setuptools.dynamic]
version = {attr = "pysbom.metadata.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "ERA",  # eradicate
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "ICN",  # flake8-import-conventions
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "I",    # isort
    "C90",  # mccabe
    "F",    # Pyflakes
    "N",    # pep8-naming
    "E",    # pycodestyle (Error)
    "W",    # pycodestyle (Warning)
    "PL",   # pylint
    "RUF",  # Ruff-specific rules
    "UP",   # pyupgrade
]
ignore = [
    "E501",     # Line too long ({width} > {limit})
    "RUF022",   # __all__ is not sorted
    "PLC0414",  # Import alias does not rename original package
    "PLR0913",  # Too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "S101",     # Use of assert detected
  "T20",      # flake8-print
]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-rsxX --tb=short --strict-markers"
xfail_strict = true
testpaths = "tests"
markers = [
    "raises: Tests that are expected to raise an exception.",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
